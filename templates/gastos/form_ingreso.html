{% extends 'gastos/base.html' %}
{% block titulo %}Nuevo Ingreso{% endblock %}
{% block contenido %}
<h4 class="mb-4">Nuevo Ingreso</h4>
<div class="col-md-6">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" name="descripcion" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Monto</label>
            <input type="number" name="monto" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select">
                <option value="sueldo">Sueldo</option>
                <option value="extra">Extra</option>
                <option value="pyme">Pyme</option>
                <option value="otro">Otro</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" class="form-control">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" name="es_fijo" class="form-check-input" id="esFijo">
            <label class="form-check-label" for="esFijo">Es ingreso fijo mensual</label>
        </div>
        <button type="submit" class="btn btn-dark">Guardar</button>
        <a href="{% url 'lista_ingresos' %}" class="btn btn-outline-dark">Cancelar</a>
    </form>
</div>
{% endblock %}
