<!-- base.html COMPLETO — reemplaza el tuyo -->
<!-- Cambios respecto al anterior:
     1. Dark mode con toggle (persistente via localStorage)
     2. Link a Préstamos en el navbar
     3. CSS variables para que el dark mode funcione en toda la app
-->

<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gastos Familiares{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* =============================================
           VARIABLES CSS — El corazón del dark mode
           
           ¿Cómo funciona?
           Definimos variables con :root (modo claro) y
           con [data-theme="dark"] (modo oscuro).
           El JS solo cambia el atributo data-theme en <html>
           y el CSS hace todo el resto automáticamente.
           ============================================= */
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --bg-navbar: #212529;
            --text-body: #212529;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --table-bg: #ffffff;
            --table-hover: #f5f5f5;
        }

        [data-theme="dark"] {
            --bg-body: #1a1a2e;
            --bg-card: #16213e;
            --bg-navbar: #0f0f1a;
            --text-body: #e0e0e0;
            --text-muted: #9e9e9e;
            --border-color: #2d2d4e;
            --table-bg: #16213e;
            --table-hover: #1e1e3a;
        }

        /* Aplicar variables al body y elementos principales */
        body {
            background-color: var(--bg-body);
            color: var(--text-body);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card {
            background-color: var(--bg-card);
            border-color: var(--border-color);
        }

        .navbar {
            background-color: var(--bg-navbar) !important;
        }

        /* Las tablas también se adaptan */
        .table {
            color: var(--text-body);
        }
        .table > :not(caption) > * > * {
            background-color: var(--table-bg);
            color: var(--text-body);
            border-color: var(--border-color);
        }
        .table-hover > tbody > tr:hover > * {
            background-color: var(--table-hover);
        }

        /* Formularios */
        [data-theme="dark"] .form-control,
        [data-theme="dark"] .form-select {
            background-color: var(--bg-card);
            border-color: var(--border-color);
            color: var(--text-body);
        }

        [data-theme="dark"] .modal-content {
            background-color: var(--bg-card);
            color: var(--text-body);
        }

        /* Botón del toggle */
        #btnDarkMode {
            background: none;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 20px;
            padding: 2px 12px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        #btnDarkMode:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Responsive */
        .table-responsive { overflow-x: auto; }
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; gap: 8px; }
            .navbar a, .navbar button { font-size: 12px; }
            h4 { font-size: 18px; }
            .card h3 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-3 py-2">
        <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">💰 Gastos</a>
        
        <div class="d-flex gap-2 flex-wrap align-items-center">
            <a class="text-white text-decoration-none" href="{% url 'lista_gastos' %}">Gastos</a>
            <a class="text-white text-decoration-none" href="{% url 'lista_compras' %}">Compras</a>
            <a class="text-white text-decoration-none" href="{% url 'alertas' %}">Alertas</a>
            <a class="text-white text-decoration-none" href="{% url 'lista_recurrentes' %}">Recurrentes</a>
            <a class="text-white text-decoration-none" href="{% url 'lista_ingresos' %}">Ingresos</a>
            <a class="text-white text-decoration-none" href="{% url 'lista_prestamos' %}">Préstamos</a>
            <a class="text-white text-decoration-none" href="{% url 'estadisticas' %}">Estadísticas</a>
            
            {# Toggle dark mode #}
            <button id="btnDarkMode" title="Cambiar tema">🌙</button>
            
            <form method="post" action="{% url 'logout' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-link text-white p-0 text-decoration-none" 
                        style="font-size:12px">Salir</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        /*
         * DARK MODE — Lógica explicada paso a paso:
         *
         * 1. Al cargar la página, revisamos si el usuario ya eligió un tema
         *    (localStorage persiste aunque cierres el navegador)
         * 2. Si hay preferencia guardada, la aplicamos inmediatamente
         * 3. Al hacer clic en el botón, alternamos el tema y guardamos la elección
         *
         * ¿Por qué data-theme en <html> y no una clase en body?
         * Porque el atributo data-theme es más semántico y fácil de leer.
         * El CSS lo detecta con [data-theme="dark"] selector.
         */
        
        const btn = document.getElementById('btnDarkMode');
        const html = document.documentElement; // es el elemento <html>
        
        // Al iniciar: aplicar tema guardado
        const temaGuardado = localStorage.getItem('tema') || 'light';
        aplicarTema(temaGuardado);
        
        btn.addEventListener('click', function() {
            const temaActual = html.getAttribute('data-theme');
            const nuevoTema = temaActual === 'dark' ? 'light' : 'dark';
            aplicarTema(nuevoTema);
            localStorage.setItem('tema', nuevoTema); // guardar elección
        });
        
        function aplicarTema(tema) {
            html.setAttribute('data-theme', tema);
            btn.textContent = tema === 'dark' ? '☀️' : '🌙';
        }
    </script>
</body>
</html>
