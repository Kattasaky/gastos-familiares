<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gastos Familiares{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --bg-navbar: #212529;
            --text-body: #212529;
            --text-muted: #6c757d;
            --border-color: #dee2e6;
            --table-bg: #ffffff;
            --table-hover: #f5f5f5;
        }

        [data-theme="dark"] {
            --bg-body: #1a1a2e;
            --bg-card: #16213e;
            --bg-navbar: #0f0f1a;
            --text-body: #e0e0e0;
            --text-muted: #9e9e9e;
            --border-color: #2d2d4e;
            --table-bg: #16213e;
            --table-hover: #1e1e3a;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-body);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card {
            background-color: var(--bg-card);
            border-color: var(--border-color);
        }

        .navbar {
            background-color: var(--bg-navbar) !important;
        }

        .table {
            color: var(--text-body);
        }
        .table > :not(caption) > * > * {
            background-color: var(--table-bg);
            color: var(--text-body);
            border-color: var(--border-color);
        }
        .table-hover > tbody > tr:hover > * {
            background-color: var(--table-hover);
        }

        [data-theme="dark"] .form-control,
        [data-theme="dark"] .form-select {
            background-color: var(--bg-card);
            border-color: var(--border-color);
            color: var(--text-body);
        }

        [data-theme="dark"] .modal-content {
            background-color: var(--bg-card);
            color: var(--text-body);
        }

        #btnDarkMode {
            background: none;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 20px;
            padding: 2px 12px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        #btnDarkMode:hover {
            background: rgba(255,255,255,0.15);
        }

        .table-responsive { overflow-x: auto; }
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; gap: 8px; }
            .navbar a, .navbar button { font-size: 12px; }
            h4 { font-size: 18px; }
            .card h3 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-3 py-2">
        <a class="navbar-brand fw-bold" href="{% url 'inicio' %}">💰 Gastos</a>
        
        <div class="d-flex gap-2 flex-wrap align-items-center">
            <a class="text-white text-decoration-none" href="{% url 'lista_gastos' %}">Gastos</a>
            <a class="text-white text-decoration-none" href="{% url 'lista_compras' %}">Compras</a>
            <a class="text-white text-decoration-none" href="{% url 'alertas' %}">Alertas</a>
            <a class="text-white text-decoration-none" href="{% url 'lista_recurrentes' %}">
