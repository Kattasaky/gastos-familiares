{% extends 'gastos/base.html' %}

{% block titulo %}Nuevo Pago Recurrente{% endblock %}

{% block contenido %}
<h4 class="mb-4">Nuevo Pago Recurrente</h4>
<div class="col-md-6">
    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" name="descripcion" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Monto (dejar vacío si es variable)</label>
            <input type="number" name="monto" class="form-control" step="0.01">
        </div>

        <div class="mb-3" id="bloque-dia-mes">
            <label class="form-label">Día del mes que se paga</label>
            <input type="number" name="dia_pago" class="form-control" min="1" max="31">
        </div>

        <div class="mb-3" id="bloque-dia-semana" style="display:none">
            <label class="form-label">Día de la semana</label>
            <select name="dia_semana" class="form-select">
                <option value="0">Lunes</option>
                <option value="1">Martes</option>
                <option value="2">Miércoles</option>
                <option value="3">Jueves</option>
                <option value="4">Viernes</option>
                <option value="5">Sábado</option>
                <option value="6">Domingo</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select name="categoria" class="form-select">
                <option value="">Sin categoría</option>
                {% for c in categorias %}
                    <option value="{{ c.pk }}">{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Frecuencia</label>
            <select name="frecuencia" class="form-select">
                <option value="mensual">Mensual fijo</option>
                <option value="semanal">Semanal</option>
                <option value="cuotas">En cuotas</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Total de cuotas (solo si es en cuotas)</label>
            <input type="number" name="total_cuotas" class="form-control" min="1" max="999">
        </div>

        <div class="mb-3">
            <label class="form-label">Cuotas ya pagadas (si el crédito ya está en curso)</label>
            <input type="number" name="cuotas_pagadas" class="form-control" min="0" max="999" value="0">
            <div class="form-text">
                Ej: si llevas 170 de 180 cuotas pagadas, pon 170 aquí.
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Prioridad</label>
            <select name="prioridad" class="form-select">
                <option value="urgente">Urgente</option>
                <option value="alta">Alta</option>
                <option value="normal">Normal</option>
                <option value="postergable">Postergable</option>
            </select>
        </div>

        <button type="submit" class="btn btn-dark">Guardar</button>
        <a href="{% url 'lista_recurrentes' %}" class="btn btn-outline-dark">Cancelar</a>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        function actualizarCampos() {
            const frecuencia = document.querySelector('[name=frecuencia]').value;
            document.getElementById('bloque-dia-mes').style.display =
                (frecuencia === 'mensual' || frecuencia === 'cuotas') ? 'block' : 'none';
            document.getElementById('bloque-dia-semana').style.display =
                (frecuencia === 'semanal') ? 'block' : 'none';
        }
        document.querySelector('[name=frecuencia]').addEventListener('change', actualizarCampos);
        actualizarCampos();
    });
</script>
{% endblock %}
