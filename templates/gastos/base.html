<!-- Esta es la plantilla base de la aplicación gastos. -->
<!-- Todas las demás plantillas extienden esta, lo que significa que heredan su estructura y solo necesitan definir el contenido específico de cada página. -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gastos Familiares{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="{% url 'inicio' %}">💰 Gastos Familiares</a>
        <div class="d-flex gap-3">
            <a class="text-white" href="{% url 'lista_gastos' %}">Gastos</a>
            <a class="text-white" href="{% url 'lista_compras' %}">Compras</a>
            <a class="text-white" href="{% url 'alertas' %}">Alertas</a>
            <a class="text-white" href="{% url 'logout' %}">Salir</a>
            <a class="text-white" href="{% url 'lista_recurrentes' %}">Recurrentes</a>
            <a class="text-white" href="{% url 'lista_ingresos' %}">Ingresos</a>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
