<!-- Esta es la plantilla base de la aplicación gastos. -->
<!-- Todas las demás plantillas extienden esta, lo que significa que heredan su estructura y solo necesitan definir el contenido específico de cada página. -->

<!DOCTYPE html>
<html lang="es">
    <style>
.table-responsive { overflow-x: auto; }
@media (max-width: 768px) {
    .navbar { flex-wrap: wrap; gap: 8px; }
    .navbar a { font-size: 13px; }
    h4 { font-size: 18px; }
    .card h3 { font-size: 20px; }
}
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gastos Familiares{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="{% url 'inicio' %}">💰 Gastos Familiares</a>
        <div class="d-flex gap-3">
            <a class="text-white" href="{% url 'lista_gastos' %}">Gastos</a>
            <a class="text-white" href="{% url 'lista_compras' %}">Compras</a>
            <a class="text-white" href="{% url 'alertas' %}">Alertas</a>
            <form method="post" action="{% url 'logout' %}" style="display:inline">
    {% csrf_token %}
    <button type="submit" class="btn btn-link text-white p-0">Salir</button>
</form>
            <a class="text-white" href="{% url 'lista_recurrentes' %}">Recurrentes</a>
            <a class="text-white" href="{% url 'lista_ingresos' %}">Ingresos</a>
            <a class="text-white" href="{% url 'estadisticas' %}">Estadísticas</a>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
